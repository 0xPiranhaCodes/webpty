# Release archives for macOS and Linux, amd64 and arm64, with checksums and
# SBOMs. goreleaser never publishes or signs: release.yml adds the Homebrew
# formula to the checksums (scripts/release-assemble.sh), then signs,
# attests, and uploads everything as one draft release.
#
#   make snapshot        local build into dist/, verified; nothing published
#
# Builds are reproducible: CGO is off, paths are trimmed, and every
# timestamp (binary and archive entries) is the tagged commit's time.
version: 2
project_name: webpty

before:
  hooks:
    # The UI is built and embedded beforehand (make snapshot, or a separate
    # unprivileged workflow job), never by goreleaser itself, so no frontend
    # tooling runs here. Each archive holds one offline-capable executable.
    - sh -c 'test -f internal/webassets/dist/index.html || { echo "the web UI is not embedded; build it first (see the Makefile)" >&2; exit 1; }'

builds:
  - id: webpty
    main: ./cmd/webpty
    binary: webpty
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/0xPiranhaCodes/webpty/internal/buildinfo.version={{.Version}}
      - -X github.com/0xPiranhaCodes/webpty/internal/buildinfo.commit={{.FullCommit}}
      - -X github.com/0xPiranhaCodes/webpty/internal/buildinfo.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: webpty
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: docs/*.md
        dst: docs
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  disable: true
